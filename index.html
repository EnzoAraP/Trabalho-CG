
<!DOCTYPE html>
<html>
<head>
    <title>First Person</title>
    <link rel="shortcut icon" href="../favicon.ico">
    <link rel="stylesheet" href="../html/resources/default.css">
    <link rel="stylesheet" href="../html/resources/menuFirstPerson.css">    
    <meta name="viewport" content="width=device-width, initial-scale=1">  
	
    <style>
      /* Tela de loading */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: black;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-family: sans-serif;
      }

      /* Texto ou spinner */
      #loader {
        width: 50px;
        height: 50px;
        border: 5px solid #ccc;
        border-top: 5px solid limegreen;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      /* Barra de progresso opcional */
      #progress-bar {
        width: 60%;
        height: 20px;
        background: #333;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 20px;
      }

      #progress-bar-fill {
        width: 0%;
        height: 100%;
        background: limegreen;
        transition: width 0.3s;
      }

      /* Animação do spinner */
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Desaparecer suavemente */
      .fade-out {
        opacity: 0;
        transition: opacity 1s ease;
        pointer-events: none;
      }

      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        margin-top: -5px;
        z-index: 10;
        pointer-events: none;
      }

      #crosshair::before, #crosshair::after {
        content: '';
        position: absolute;
        background: white;
      }

      #crosshair::before {
        width: 2px;
        height: 10px;
        left: 4px;
        top: 0;
      }

      #crosshair::after {
        width: 10px;
        height: 2px;
        top: 4px;
        left: 0;
      }
</style>
</head>

<body>
  <section id="loading-screen">
    <div id="loader"></div> <!-- ou barra de progresso -->
  </section>
  <style>
#mensagemDerrota {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 20px 40px;
    font-size: 72px;
    border-radius: 8px;
    text-align: center;
    z-index: 999;
}
</style>

<div id="mensagemDerrota">Você morreu!</div>

  <!-- Import maps polyfill -- Remove this when import maps will be widely supported-->
  <script async src="https://unpkg.com/es-module-shims@1.3.6/dist/es-module-shims.js"></script>  
  <script type="importmap"> 
    {"imports": {"three": "../build/three.module.js"}} 

  </script> 
    

  <div id="crosshair"></div>
    <div id="blocker" class="w3-display-container">
    <div id="instructions" class="w3-display-middle w3-center w3-white w3-opacity">
        <h1>Instruções</h1>
        <p>Movimentos: WASD e setas</p>
        <p>Olhar pelo entrono: Mouse</p>
        <p>Atirar: Botões esquerdo e direito do mouse</p>
        <p>(Click to continue)</p>
    </div>
  </div>
<script>
  // Ocultar tela de loading quando o jogo carregar
  window.addEventListener('load', function() {
    const loadingScreen = document.getElementById('loading-screen');
    
    // Adicionar fade-out para transição suave
    loadingScreen.classList.add('fade-out');
    
    // Remover completamente após a animação
    setTimeout(() => {
      loadingScreen.style.display = 'none';
    }, 1000);
  });
</script>
  <div id="webgl-output">            
    <script type="module" src="T3/ArquivoPrincipalTrabalho copy 2.js"></script>
  </div>
</body>
</html>
