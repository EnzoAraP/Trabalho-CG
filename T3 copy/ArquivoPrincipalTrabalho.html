<!DOCTYPE html>
<html>
<head>
    <title>First Person</title>
    <link rel="shortcut icon" href="../favicon.ico">
    <link rel="stylesheet" href="../html/resources/default.css">
    <link rel="stylesheet" href="../html/resources/menuFirstPerson.css">    
    <meta name="viewport" content="width=device-width, initial-scale=1">  
    <style>
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        margin-left: -5px;
        margin-top: -5px;
        z-index: 10;
        pointer-events: none;
      }

      #crosshair::before, #crosshair::after {
        content: '';
        position: absolute;
        background: white;
      }

      #crosshair::before {
        width: 2px;
        height: 10px;
        left: 4px;
        top: 0;
      }

      #crosshair::after {
        width: 10px;
        height: 2px;
        top: 4px;
        left: 0;
      }
</style>
</head>

<body>
  <style>
#mensagemDerrota {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.8);
    color: white;
    padding: 20px 40px;
    font-size: 72px;
    border-radius: 8px;
    text-align: center;
    z-index: 999;
}
#mensagemVitoria {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 128, 0, 0.9); /* verde translúcido */
    color: #fff;
    padding: 20px 40px;
    font-size: 72px;
    border-radius: 8px;
    text-align: center;
    z-index: 999;
    box-shadow: 0 0 20px rgba(0, 255, 0, 0.8);
}

#mensagemChaves {
    display: none;
    position: fixed;
    top: 20%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 128, 255, 0.5);
    color: white;
    padding: 20px 40px;
    font-size: 64px;
    border-radius: 8px;
    text-align: center;
    z-index: 999;
    box-shadow: 0 0 20px rgba(0, 128, 255, 0.7);
}






</style>
<div id="mensagemChaves">Você obteve todas as chaves!</div>
<div id="mensagemVitoria">🎉 Você venceu! 🎉</div>
<div id="mensagemDerrota">Você morreu!</div>

  <div id="crosshair"></div>

        <p>Movimentos: WASD e setas</p>
        <p>Olhar pelo entrono: Mouse</p>
        <p>Atirar: Botões esquerdo e direito do mouse</p>
        <p>(Click to continue)</p>
    </div>
  </div>

  <div id="webgl-output">
